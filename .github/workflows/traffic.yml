name: 记录访问与克隆

# GitHub 只保留最近 14 天的流量数据，这里每天抓取一次并合并进仓库，
# 形成按日期累计的历史记录，同时刷新 README 中的徽章与图表。

on:
  schedule:
    # 每 14 天抓取一次。cron 不支持严格的“每 14 天”，*/14 在每月
    # 1、15、29 日触发，相邻两次最长间隔 14 天。
    - cron: "0 4 */14 * *" # 04:00 UTC，即北京时间 12:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: traffic
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 安装绘图依赖
        run: pip install --quiet matplotlib

      - name: 抓取并合并流量数据
        env:
          # /traffic/* 需要 PAT：GITHUB_TOKEN 即使声明 administration:read 也会被拒绝
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: python scripts/collect_traffic.py

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traffic/
          if git diff --cached --quiet; then
            echo "没有新数据"
            exit 0
          fi
          git commit -m "chore: 更新访问与克隆数据"
          git push
